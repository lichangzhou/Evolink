name: Feature request
description: Suggest an improvement
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to accomplish that is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - UI / frontend
        - Core engine
        - Integration (Emby / Jellyfin / Plex / Playable)
        - Deployment / packaging
        - Documentation
    validations:
      required: true
