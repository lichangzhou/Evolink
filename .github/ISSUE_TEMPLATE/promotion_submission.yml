name: Promotion submission
description: Submit a write-up, video or article about this project
title: "[promo] "
labels: [promotion]
body:
  - type: input
    id: channel
    attributes:
      label: Channel
      placeholder: "blog / video / forum post / talk"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: "https://..."
  - type: textarea
    id: desc
    attributes:
      label: What does it cover?
    validations:
      required: true
